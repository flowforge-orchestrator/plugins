# RAG plugin sidecar + its stores, attached to a running local Conveyor demo.
#
# Prerequisite — local demo (one of):
#   docker compose -f compose.demo.yml --env-file compose.env.example up -d
#   # or an already running Hub demo (e.g. flowforge-demo) on Docker network
#
# Then from plugins repo root:
#   docker compose -f compose.rag.yml --env-file compose.rag.env.example up -d --build
#
# Default network: flowforge-demo_default (conveyor-release/demo).
# Override DEMO_NETWORK_NAME for compose.demo.yml (conveyor-plugins-demo_default).

name: conveyor-plugin-rag

x-plugin-to-demo: &plugin-to-demo
  CONTROL_PLANE_TCP_HOST: ${CONTROL_PLANE_TCP_HOST:-demo}
  RUNTIME_CONTROL_PLANE_TCP_PORT: ${DEMO_CP_TCP_PORT:-4021}
  PLUGIN_MANAGER_RPC_HOST: ${PLUGIN_MANAGER_RPC_HOST:-demo}
  PLUGIN_MANAGER_RPC_PORT: ${DEMO_PM_TCP_PORT:-4016}
  PLUGIN_CONTROL_PLANE_KEY: ${PLUGIN_CONTROL_PLANE_KEY:-demo-internal-key}
  PLUGIN_MANAGER_INGRESS_TOKEN: ${PLUGIN_MANAGER_INGRESS_TOKEN:-demo-plugin-ingress}
  DISABLE_RUNTIME_STEP_ACK: ${DISABLE_RUNTIME_STEP_ACK:-false}

services:
  rag-qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    networks:
      - rag-data
    volumes:
      - rag_qdrant_data:/qdrant/storage

  rag-neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    networks:
      - rag-data
    environment:
      NEO4J_AUTH: neo4j/${RAG_NEO4J_PASSWORD:-rag-neo4j-local}
      NEO4J_PLUGINS: '[]'
    volumes:
      - rag_neo4j_data:/data

  rag:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN_DIR: rag
    image: ${RAG_PLUGIN_IMAGE:-plugin-rag:latest}
    restart: unless-stopped
    depends_on:
      - rag-qdrant
      - rag-neo4j
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${DEMO_RAG_EXECUTOR_PORT:-9406}:${DEMO_RAG_EXECUTOR_PORT:-9406}'
      - '${DEMO_RAG_HEALTH_PORT:-9407}:${DEMO_RAG_HEALTH_PORT:-9407}'
    environment:
      <<: *plugin-to-demo
      PLUGIN_PULL_ADVERTISED_HOST: ${DEMO_RAG_PULL_HOST:-rag}
      PLUGIN_TCP_PORT: ${DEMO_RAG_EXECUTOR_PORT:-9406}
      EXECUTOR_TCP_PORT: ${DEMO_RAG_EXECUTOR_PORT:-9406}
      PORT: ${DEMO_RAG_EXECUTOR_PORT:-9406}
      PLUGIN_HEALTH_HTTP_PORT: ${DEMO_RAG_HEALTH_PORT:-9407}
      PLUGIN_PUBLICATION_VERSION: ${RAG_PUBLICATION_VERSION:-0.0.43}
      QDRANT_URL: http://rag-qdrant:6333
      NEO4J_URI: bolt://rag-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${RAG_NEO4J_PASSWORD:-rag-neo4j-local}
      RAG_DATA_DIR: /data/rag
      # Local Ollama on the Docker host (embedder + chat / mlx)
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:latest}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-gemma4:12b-mlx}
      LLM_API_STYLE: ${LLM_API_STYLE:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-180000}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://host.docker.internal:11434/v1}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3:0.6b}
      RERANK_TIMEOUT_MS: ${RERANK_TIMEOUT_MS:-120000}
    volumes:
      - rag_plugin_data:/data/rag
    networks:
      - demo
      - rag-data

networks:
  demo:
    name: ${DEMO_NETWORK_NAME:-flowforge-demo_default}
    external: true
  rag-data:
    name: conveyor-rag-data

volumes:
  rag_qdrant_data:
  rag_neo4j_data:
  rag_plugin_data:
