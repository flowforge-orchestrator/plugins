# Share tokens with backend stack: docker compose --env-file ../../backend/.env up -d
# (otherwise ${PLUGIN_MANAGER_INGRESS_TOKEN:-dev-plugin-ingress} uses shell only; a custom backend .env token must match here).
name: plugin-telegram

services:
  telegram-plugin:
    build:
      context: .
      dockerfile: Dockerfile.dist
    image: ${TELEGRAM_PLUGIN_IMAGE:-plugin-telegram:latest}
    restart: unless-stopped
    ports:
      - '${EXECUTOR_TCP_PORT:-9500}:${EXECUTOR_TCP_PORT:-9500}'
      - '${PLUGIN_HEALTH_HTTP_PORT:-9501}:${PLUGIN_HEALTH_HTTP_PORT:-9501}'
    environment:
      EXECUTOR_TCP_PORT: 9500
      PORT: 9500
      PLUGIN_HEALTH_HTTP_PORT: 9501
      PLUGIN_PULL_ADVERTISED_HOST: host.docker.internal
      PLUGIN_MANAGER_INGRESS_TOKEN: ${PLUGIN_MANAGER_INGRESS_TOKEN:-key}
      PLUGIN_CONTROL_PLANE_KEY: ${PLUGIN_CONTROL_PLANE_KEY:-key}
      # TCP ingress CP (compose.dev: 4021→контейнер :3001) — паттерны plugin.executor.step_ack / step_result
      CONTROL_PLANE_TCP_HOST: ${CONTROL_PLANE_TCP_HOST:-host.docker.internal}
      RUNTIME_CONTROL_PLANE_TCP_PORT: ${RUNTIME_CONTROL_PLANE_TCP_PORT:-4021}
      DISABLE_RUNTIME_STEP_ACK: false
      PLUGIN_MANAGER_RPC_HOST: host.docker.internal
      PLUGIN_MANAGER_RPC_PORT: 4016
