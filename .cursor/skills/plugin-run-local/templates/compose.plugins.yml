# Snippet-only: copy `myplugin` into repo docker-compose.yml (do not run from this directory).
# Runnable stack: repository root — docker-compose.yml + compose.env.example.

name: conveyor-plugins-sidecar

x-plugin-env: &plugin-env
  CONTROL_PLANE_TCP_HOST: ${CONTROL_PLANE_TCP_HOST:-runtime-control-plane}
  RUNTIME_CONTROL_PLANE_TCP_PORT: ${RUNTIME_CONTROL_PLANE_TCP_PORT:-3001}
  DISABLE_RUNTIME_STEP_ACK: ${DISABLE_RUNTIME_STEP_ACK:-false}
  PLUGIN_MANAGER_INGRESS_TOKEN: ${PLUGIN_MANAGER_INGRESS_TOKEN:-key}
  PLUGIN_CONTROL_PLANE_KEY: ${PLUGIN_CONTROL_PLANE_KEY:-key}
  PLUGIN_MANAGER_RPC_HOST: ${PLUGIN_MANAGER_RPC_HOST:-plugin-manager}
  PLUGIN_MANAGER_RPC_PORT: ${PLUGIN_MANAGER_RPC_PORT:-3000}

services:
  myplugin:
    build:
      context: ${PLUGIN_BUILD_CONTEXT:-.}
      dockerfile: ${PLUGIN_DOCKERFILE:-Dockerfile.plugin}
      args:
        PLUGIN_DIR: ${PLUGIN_DIR:-myplugin}
    restart: unless-stopped
    ports:
      - '${MYPLUGIN_EXECUTOR_PORT:-9409}:${MYPLUGIN_EXECUTOR_PORT:-9409}'
    environment:
      <<: *plugin-env
      PLUGIN_PULL_ADVERTISED_HOST: ${MYPLUGIN_PULL_HOST:-myplugin}
      PLUGIN_TCP_PORT: ${MYPLUGIN_EXECUTOR_PORT:-9409}
      EXECUTOR_TCP_PORT: ${MYPLUGIN_EXECUTOR_PORT:-9409}
      PORT: ${MYPLUGIN_EXECUTOR_PORT:-9409}
      PLUGIN_HEALTH_HTTP_PORT: ${MYPLUGIN_HEALTH_PORT:-}
