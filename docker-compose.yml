# Запуск и сборка всего набора плагинов из одного файла.
#
# Из каталога plugins/ (контекст сборки — этот каталог; SDK с npm, см. package-lock.json):
#   docker compose --env-file ../backend/.env up -d --build
#
# Образы собираются в Dockerfile.plugin (multi-stage: npm ci в workspace + build), dist на хосте не нужен.

name: auto-flow-plugins

x-plugin-env: &plugin-env
  PLUGIN_PULL_ADVERTISED_HOST: ${PLUGIN_PULL_ADVERTISED_HOST:-host.docker.internal}
  CONTROL_PLANE_TCP_HOST: ${CONTROL_PLANE_TCP_HOST:-host.docker.internal}
  RUNTIME_CONTROL_PLANE_TCP_PORT: ${RUNTIME_CONTROL_PLANE_TCP_PORT:-4021}
  DISABLE_RUNTIME_STEP_ACK: ${DISABLE_RUNTIME_STEP_ACK:-false}
  PLUGIN_MANAGER_INGRESS_TOKEN: ${PLUGIN_MANAGER_INGRESS_TOKEN:-key}
  PLUGIN_CONTROL_PLANE_KEY: ${PLUGIN_CONTROL_PLANE_KEY:-key}
  PLUGIN_MANAGER_RPC_HOST: ${PLUGIN_MANAGER_RPC_HOST:-host.docker.internal}
  PLUGIN_MANAGER_RPC_PORT: ${PLUGIN_MANAGER_RPC_PORT:-4016}

x-plugin-hosts: &plugin-hosts
  extra_hosts:
    - 'host.docker.internal:host-gateway'

services:
  telegram:
    <<: *plugin-hosts
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN_DIR: telegram
    image: ${TELEGRAM_PLUGIN_IMAGE:-plugin-telegram:latest}
    restart: unless-stopped
    ports:
      - '${TELEGRAM_EXECUTOR_TCP_PORT:-9400}:${TELEGRAM_EXECUTOR_TCP_PORT:-9400}'
      - '${TELEGRAM_PLUGIN_HEALTH_HTTP_PORT:-9480}:${TELEGRAM_PLUGIN_HEALTH_HTTP_PORT:-9480}'
    environment:
      <<: *plugin-env
      PLUGIN_TCP_PORT: ${TELEGRAM_EXECUTOR_TCP_PORT:-9400}
      EXECUTOR_TCP_PORT: ${TELEGRAM_EXECUTOR_TCP_PORT:-9400}
      PORT: ${TELEGRAM_EXECUTOR_TCP_PORT:-9400}
      PLUGIN_HEALTH_HTTP_PORT: ${TELEGRAM_PLUGIN_HEALTH_HTTP_PORT:-9480}

  jira:
    <<: *plugin-hosts
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN_DIR: jira
    image: ${JIRA_PLUGIN_IMAGE:-plugin-jira:latest}
    restart: unless-stopped
    ports:
      - '${JIRA_EXECUTOR_TCP_PORT:-9401}:${JIRA_EXECUTOR_TCP_PORT:-9401}'
    environment:
      <<: *plugin-env
      PLUGIN_TCP_PORT: ${JIRA_EXECUTOR_TCP_PORT:-9401}
      EXECUTOR_TCP_PORT: ${JIRA_EXECUTOR_TCP_PORT:-9401}
      PORT: ${JIRA_EXECUTOR_TCP_PORT:-9401}

  redmine:
