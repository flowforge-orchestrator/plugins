    image: ${EMAIL_PLUGIN_IMAGE:-plugin-email:latest}
    restart: unless-stopped
    ports:
      - '${EMAIL_EXECUTOR_TCP_PORT:-9410}:${EMAIL_EXECUTOR_TCP_PORT:-9410}'
    environment:
