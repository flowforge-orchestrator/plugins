# Запуск и сборка всего набора плагинов из одного файла.
#
# Из каталога plugins/:
#   docker compose --env-file ../backend/.env up -d --build
#
# Образы: Dockerfile.plugin (multi-stage), dist на хосте не нужен.
#
# Рекомендуется одна user-defined сеть с plugin-manager и runtime-control-plane.
# Внутри сети PM слушает :3000, CP (ingress) — :3001 (не хостовые 4016/4021).
# В манифесте pull.host = DNS-имя сервиса плагина (см. PLUGIN_PULL_ADVERTISED_HOST у каждого сервиса).
# Если PM/CP крутятся на хосте — переопределите PLUGIN_MANAGER_RPC_* и CONTROL_PLANE_* в .env.
#
# Опционально для любого плагина: PLUGIN_HEALTH_HTTP_PORT и второй ports: — HTTP GET /health (NestFactory + express).

name: auto-flow-plugins

x-plugin-env: &plugin-env
  CONTROL_PLANE_TCP_HOST: ${CONTROL_PLANE_TCP_HOST:-runtime-control-plane}
  RUNTIME_CONTROL_PLANE_TCP_PORT: ${RUNTIME_CONTROL_PLANE_TCP_PORT:-3001}
  DISABLE_RUNTIME_STEP_ACK: ${DISABLE_RUNTIME_STEP_ACK:-false}
  PLUGIN_MANAGER_INGRESS_TOKEN: ${PLUGIN_MANAGER_INGRESS_TOKEN:-key}
  PLUGIN_CONTROL_PLANE_KEY: ${PLUGIN_CONTROL_PLANE_KEY:-key}
  PLUGIN_MANAGER_RPC_HOST: ${PLUGIN_MANAGER_RPC_HOST:-plugin-manager}
  PLUGIN_MANAGER_RPC_PORT: ${PLUGIN_MANAGER_RPC_PORT:-3000}

services:
  telegram:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN_DIR: telegram
    image: ${TELEGRAM_PLUGIN_IMAGE:-plugin-telegram:latest}
    restart: unless-stopped
    ports:
      - '${TELEGRAM_EXECUTOR_TCP_PORT:-9400}:${TELEGRAM_EXECUTOR_TCP_PORT:-9400}'
    environment:
      <<: *plugin-env
      PLUGIN_PULL_ADVERTISED_HOST: ${TELEGRAM_PLUGIN_PULL_ADVERTISED_HOST:-telegram}
      PLUGIN_TCP_PORT: ${TELEGRAM_EXECUTOR_TCP_PORT:-9400}
      EXECUTOR_TCP_PORT: ${TELEGRAM_EXECUTOR_TCP_PORT:-9400}
      PORT: ${TELEGRAM_EXECUTOR_TCP_PORT:-9400}

