      EXECUTOR_TCP_PORT: ${LLM_EXECUTOR_TCP_PORT:-9404}
      PORT: ${LLM_EXECUTOR_TCP_PORT:-9404}

  wildberries:
    <<: *plugin-hosts
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN_DIR: wildberries
