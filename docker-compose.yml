    environment:
      <<: *plugin-env
      PLUGIN_TCP_PORT: ${REDMINE_EXECUTOR_TCP_PORT:-9402}
      EXECUTOR_TCP_PORT: ${REDMINE_EXECUTOR_TCP_PORT:-9402}
      PORT: ${REDMINE_EXECUTOR_TCP_PORT:-9402}

  llm:
